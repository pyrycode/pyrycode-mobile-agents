// Pipeline builds take two machine-wide places under ~/.gradle/pyry-build-slots.
// Manual projects and device task invocations retain their existing exclusion.
// Admission starts before project configuration. With configuration caching,
// Gradle closes that instance after configuration and recreates it before the
// first consuming task. Cache hits also acquire before execution. Only service
// parameters are serialized. Never place a FileLock in System.properties.
// Waiting remains bounded at 20 minutes and errors retain the existing fail-open
// policy. Kernel record locks disappear when the owning JVM exits.

import java.nio.channels.FileChannel
import java.nio.channels.OverlappingFileLockException
import java.nio.file.StandardOpenOption
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.provider.Property
import org.gradle.api.services.BuildService
import org.gradle.api.services.BuildServiceParameters

interface PyryBuildSlotParameters extends BuildServiceParameters {
    DirectoryProperty getSlotDirectory()
    Property<Integer> getSlots()
    Property<Integer> getMaxWaitMinutes()
}

abstract class PyryBuildSlot implements BuildService<PyryBuildSlotParameters>, AutoCloseable {
    private Object held

    PyryBuildSlot() {
        try {
            def dir = parameters.slotDirectory.get().asFile
            dir.mkdirs()
            def slots = parameters.slots.get()
            def maxWait = parameters.maxWaitMinutes.get()
            def began = System.currentTimeMillis()
            def deadline = began + maxWait * 60_000L
            def nextNote = began
            while (held == null) {
                for (i in 1..slots) {
                    def channel = FileChannel.open(new File(dir, "slot-${i}.lock").toPath(),
                            StandardOpenOption.CREATE, StandardOpenOption.WRITE)
                    try {
                        held = channel.tryLock()
                    } catch (OverlappingFileLockException ignored) {
                        held = null
                    }
                    if (held != null) break
                    channel.close()
                }
                if (held != null) break
                def now = System.currentTimeMillis()
                if (now >= deadline) {
                    println "Pyrycode build slots: no place after ${maxWait} minutes; building without one."
                    break
                }
                if (now >= nextNote) {
                    println "Pyrycode build slots: all ${slots} places are taken by other pipeline builds; waiting (${(now - began).intdiv(60_000)} min so far)."
                    nextNote = now + 60_000L
                }
                Thread.sleep(5_000L)
            }
            if (held != null) {
                println "Pyrycode build slots: got a place after ${(System.currentTimeMillis() - began).intdiv(1000)} s."
            }
        } catch (Throwable error) {
            println "Pyrycode build slots: skipped after an error, building without a place: ${error}"
        }
    }

    @Override
    void close() {
        try { held?.release() } catch (ignored) {}
        try { held?.channel()?.close() } catch (ignored) {}
        held = null
    }
}

def DEVICE_TASK = ~/(?!assemble|compile|bundle|package|merge|process|generate|lint|check|test)[A-Za-z0-9]*AndroidTest/
try {
    def start = gradle.startParameter
    def root = (start.projectDir ?: start.currentDir).canonicalPath
    def deviceRun = start.taskNames.any { DEVICE_TASK.matcher(it.tokenize(":").last()).matches() }
    if (gradle.parent == null && root.contains("/.pyrycode-worktrees/") && !deviceRun) {
        def slots = (start.systemPropertiesArgs["pyry.buildSlots"] ?: "2") as int
        def service = gradle.sharedServices.registerIfAbsent("pyryBuildSlot", PyryBuildSlot) {
            parameters.slotDirectory.set(new File(gradle.gradleUserHomeDir, "pyry-build-slots"))
            parameters.slots.set(slots)
            parameters.maxWaitMinutes.set(20)
        }
        service.get()
        gradle.beforeProject { project ->
        if (project == project.rootProject) {
            project.tasks.register("pyryAcquireBuildSlot") { task ->
                task.doLast { service.get() }
            }
        }
            project.tasks.configureEach { task ->
                task.usesService(service)
            if (task.path != ":pyryAcquireBuildSlot") task.dependsOn(":pyryAcquireBuildSlot")
            }
        }
    }
} catch (Throwable error) {
    println "Pyrycode build slots: skipped after an error, building without a place: ${error}"
}
